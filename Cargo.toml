[package]
name = "argosfs"
version = "1.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "ArgosFS self-driving erasure-coded root filesystem"
authors = ["FWERKOR"]
repository = "https://github.com/fwerkor/argosfs"
homepage = "https://argosfs.org"

[lib]
name = "argosfs"
path = "src/lib.rs"

[[bin]]
name = "argosfs"
path = "src/bin/argosfs.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.6"
base64 = "0.23"
blake3 = "1.5"
chacha20poly1305 = "0.11"
clap = { version = "4.5", features = ["derive"] }
fuser_crate = { package = "fuser", version = "0.18", features = ["libfuse3"] }
hex = "0.4"
io-uring = "0.7"
imbl = { version = "7.0.2", features = ["serde"] }
libc = "0.2"
lz4_flex = "0.14"
memmap2 = "0.9.11"
parking_lot = "0.12.5"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
walkdir = "2.5"
zstd = "0.14"

[dev-dependencies]
# Test-only oracle for persisted legacy GF(2^8) parity and reconstruction.
erase = "=4.0.0"
tempfile = "3.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
# The standalone libFuzzer package and the out-of-tree ztest harness are not
# workspace members.
exclude = ["fuzz", "ztest"]
