[package]
name = "reed-solomon-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Dependency-free, no_std Reed-Solomon erasure coding over GF(2^8)"
repository = "https://github.com/stephenberry/reed-solomon-engine"
publish = false

[lib]
name = "reed_solomon_engine"
path = "src/lib.rs"

[features]
default = ["std"]
alloc = []
std = ["alloc"]
