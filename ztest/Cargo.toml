[package]
name = "argosfs-ztest"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "ztest-style randomized crash and fault-injection stress harness for ArgosFS"
publish = false

[lib]
name = "argosfs_ztest"
path = "src/lib.rs"

[[bin]]
name = "argosfs-ztest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argosfs = { path = ".." }
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
