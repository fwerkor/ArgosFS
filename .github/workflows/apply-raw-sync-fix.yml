name: Apply raw sync durability fix

on:
  push:
    branches:
      - fix/raw-journal-perf-regression
    paths:
      - .github/apply_raw_sync_fix.py
      - .github/workflows/apply-raw-sync-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: fix/raw-journal-perf-regression
          fetch-depth: 0

      - name: Apply focused source changes
        run: python3 .github/apply_raw_sync_fix.py

      - name: Validate patch shape
        run: git diff --check

      - name: Commit source and regression test
        run: |
          git config user.name "Cao Yuhang"
          git config user.email "caoyuhang@fwerkor.com"
          git add src/volume/mod.rs tests/raw_journal_durable_base_regression.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: refresh raw durable metadata on sync"
          git push origin HEAD:fix/raw-journal-perf-regression
