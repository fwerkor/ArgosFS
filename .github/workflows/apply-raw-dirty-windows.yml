name: Apply raw journal dirty-state fix Windows

on:
  push:
    branches:
      - fix/raw-journal-perf-regression
    paths:
      - .github/workflows/apply-raw-dirty-windows.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: fix/raw-journal-perf-regression
          fetch-depth: 0

      - name: Apply focused source changes
        run: python .github/apply_raw_sync_fix.py

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "Cao Yuhang"
          git config user.email "caoyuhang@fwerkor.com"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: avoid raw journal full-tree hot-path work"
          git push origin HEAD:fix/raw-journal-perf-regression
