name: Validate native arm64 mixed chaos

on:
  pull_request:
    paths:
      - .github/workflows/weekly-randomized-model.yml
      - .github/workflows/validate-native-arm64-mixed-chaos.yml
      - scripts/qemu/**
      - scripts/ci/prepare-qemu-test-env.sh

permissions:
  actions: read
  contents: read

jobs:
  validate-arm64-mixed-chaos:
    name: Native arm64 mixed-chaos validation
    runs-on: ubuntu-24.04-arm
    # mixed_chaos.sh has two independently bounded QEMU phases.
    timeout-minutes: 210
    steps:
      - name: Checkout ArgosFS
        uses: actions/checkout@v7

      - name: Verify native arm64 host
        run: test "$(uname -m)" = aarch64

      - name: Install QEMU test dependencies
        env:
          ARGOSFS_CI_QEMU_ARCH: arm64
        run: scripts/ci/install-deps.sh

      - name: Download recent arm64 QEMU bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIR: ${{ runner.temp }}/weekly-capos-qemu-bundle-arm64
        run: |
          gh run download 30002680798 \
            --repo "$GITHUB_REPOSITORY" \
            --name weekly-capos-qemu-bundle-arm64 \
            --dir "$BUNDLE_DIR"

      - name: Prepare mutable QEMU image
        env:
          ARGOSFS_QEMU_BUNDLE_DIR: ${{ runner.temp }}/weekly-capos-qemu-bundle-arm64
          ARGOSFS_QEMU_WORKDIR: ${{ runner.temp }}/native-arm64-mixed-chaos-work
        run: scripts/ci/prepare-qemu-test-env.sh

      - name: Run arm64 mixed chaos with production limits
        env:
          ARGOSFS_TEST_ARTIFACTS: ${{ runner.temp }}/native-arm64-mixed-chaos
          ARGOSFS_QEMU_MEM: "1536"
          ARGOSFS_QEMU_TIMEOUT: "5400"
          ARGOSFS_QEMU_CHAOS_FILES: "280"
          ARGOSFS_QEMU_CHAOS_WORKERS: "8"
        run: scripts/qemu/mixed_chaos.sh

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-arm64-mixed-chaos-validation
          path: ${{ runner.temp }}/native-arm64-mixed-chaos
          if-no-files-found: ignore
