name: Coverage

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-coverage:
    name: Rust line coverage (>= 80%)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout ArgosFS
        uses: actions/checkout@v7

      - name: Checkout pjdfstest
        uses: actions/checkout@v7
        with:
          repository: pjd/pjdfstest
          ref: ededbeb2b44929972898afb87474b0937f78a877
          path: external/pjdfstest

      - name: Install system dependencies
        run: scripts/ci/install-deps.sh

      - name: Install Rust toolchain
        run: scripts/ci/install-rust.sh stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-coverage

      # A hit on the existing Rust cache key cannot save a newly installed
      # binary. Give the pinned llvm-cov CLI its own reusable cache entry.
      - name: Cache cargo-llvm-cov executable
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-${{ runner.os }}-${{ runner.arch }}-v0.8.7

      - name: Install cargo-llvm-cov
        run: |
          if ! cargo llvm-cov --version 2>/dev/null | grep -Eq '^cargo-llvm-cov 0\.8\.7([[:space:]]|$)'; then
            cargo install cargo-llvm-cov --version 0.8.7 --locked --force
          fi

      - name: Prepare FUSE
        run: |
          sudo modprobe fuse || true
          test -c /dev/fuse
          sudo chmod 0666 /dev/fuse
          sudo sh -c 'grep -qxF user_allow_other /etc/fuse.conf 2>/dev/null || printf "%s\n" user_allow_other >>/etc/fuse.conf'

      - name: Enforce line coverage
        env:
          ARGOSFS_COVERAGE_REQUIRE_FUSE: "1"
          ARGOSFS_COVERAGE_MIN_LINES: "80"
          ARGOSFS_PJDFSTEST_JOBS: "4"
          PJDFSTEST_ROOT: ${{ github.workspace }}/external/pjdfstest
        run: scripts/ci/run-coverage.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: argosfs-coverage
          path: target/coverage
          if-no-files-found: warn
