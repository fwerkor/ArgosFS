name: Apply journal performance regression fix

on:
  push:
    branches:
      - fix/raw-journal-perf-regression
    paths:
      - .github/apply_perf_regression_fix.py
      - .github/workflows/apply-perf-regression-fix.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/apply_perf_regression_fix.py
      - .github/workflows/apply-perf-regression-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply focused source changes
        run: python3 .github/apply_perf_regression_fix.py

      - name: Validate patch shape
        run: git diff --check

      - name: Commit resulting fix
        run: |
          git config user.name "Cao Yuhang"
          git config user.email "caoyuhang@fwerkor.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: avoid redundant raw journal base hashing"
          git push origin HEAD:"$TARGET_BRANCH"
