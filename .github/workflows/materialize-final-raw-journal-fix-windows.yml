name: Materialize final raw journal fix

on:
  push:
    branches:
      - fix/raw-journal-perf-regression
    paths:
      - .github/workflows/materialize-final-raw-journal-fix-windows.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/raw-journal-perf-regression
          fetch-depth: 0
      - run: python3 .github/apply_final_raw_journal_fix.py
      - run: git diff --check
      - run: |
          git config user.name "Cao Yuhang"
          git config user.email "caoyuhang@fwerkor.com"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: guard trusted raw journal delta bases"
          git push origin HEAD:fix/raw-journal-perf-regression
