name: Validate and apply final raw journal fix

on:
  push:
    branches:
      - fix/raw-journal-perf-regression
    paths:
      - .github/apply_final_raw_journal_fix.py
      - .github/workflows/apply-final-raw-journal-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/raw-journal-perf-regression
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential fuse3 libfuse3-dev libssl-dev pkg-config

      - name: Install Rust
        run: scripts/ci/install-rust.sh stable

      - name: Apply focused patch
        run: python3 .github/apply_final_raw_journal_fix.py

      - name: Format and patch checks
        run: |
          cargo fmt --all
          git diff --check

      - name: Read/write replay regression
        run: cargo test --test raw_journal_durable_base_regression -- --test-threads=1

      - name: Multi-member reshape replay regression
        run: cargo test --test integration block_backend::raw_reshape_replay_uses_only_durable_delta_bases -- --exact --test-threads=1 --nocapture

      - name: Stale raw delta-base validation
        run: cargo test --lib storage::raw::store::tests::journal_falls_back_to_checkpoint_when_delta_base_hash_is_stale -- --exact --test-threads=1

      - name: Commit source fix
        run: |
          git config user.name "Cao Yuhang"
          git config user.email "caoyuhang@fwerkor.com"
          git add src/volume/mod.rs src/volume/namespace.rs
          git diff --cached --check
          git commit -m "fix: verify raw journal delta bases per mount"
          git push origin HEAD:fix/raw-journal-perf-regression
